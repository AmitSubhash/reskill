[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reskill"
version = "0.1.0"
description = "Turn AI thinking time into developer growth"
readme = "VISION.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Amit T Subhash"}]
keywords = ["claude-code", "developer-tools", "learning", "micro-learning", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Software Development",
]

[project.scripts]
reskill = "reskill.cli:main"

[project.urls]
Homepage = "https://github.com/AmitSubhash/reskill"
Repository = "https://github.com/AmitSubhash/reskill"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
