[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reskill-claude"
version = "0.2.1"
description = "A terminal companion for Claude Code. While Claude thinks for 23 seconds, reSkill hands you a quiz about the exact code it's working on."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Amit Subhash"}]
keywords = [
    "claude-code",
    "developer-tools",
    "learning",
    "micro-learning",
    "terminal",
    "tui",
    "spaced-repetition",
    "tmux",
    "quizzes",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development",
    "Topic :: Terminals",
]

[project.scripts]
reskill = "reskill.cli:main"

[project.urls]
Homepage = "https://github.com/AmitSubhash/reskill"
Repository = "https://github.com/AmitSubhash/reskill"
Issues = "https://github.com/AmitSubhash/reskill/issues"
Changelog = "https://github.com/AmitSubhash/reskill/releases"

[tool.setuptools.packages.find]
include = ["reskill*"]
exclude = ["archive*", "marketing*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# question.py is a data file. Option strings are intentionally long
# and one per line; wrapping them for E501 would hurt readability.
"reskill/question.py" = ["E501"]
